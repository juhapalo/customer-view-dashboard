map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, re-resolve go2rtc so container recreation does not break the proxy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $go2rtc http://go2rtc:1984;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Only the go2rtc player and read-only stream endpoints are exposed here.
    # The go2rtc Web UI / config API stays private (see docker-compose.yaml).
    location ~ ^/go2rtc/(stream\.html|video-stream\.js|video-rtc\.js)$ {
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass $go2rtc;
    }

    # Stream endpoints: only allow plain stream names (no source URLs) as "src".
    location ~ ^/go2rtc/api/(ws|stream\.m3u8|stream\.mp4|stream\.mjpeg|frame\.jpeg)$ {
        if ($arg_src !~ "^[A-Za-z0-9_-]+$") {
            return 403;
        }
        if ($args ~ "(^|&)src=.*&src=") {
            return 403;
        }
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass $go2rtc;
    }

    # HLS playlists/segments of an already started session
    location /go2rtc/api/hls/ {
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass $go2rtc;
    }

    location /go2rtc/ {
        return 403;
    }
}
