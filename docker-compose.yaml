name: customer-view-dashboard

services:
  # Pulls the IP camera feeds and re-streams them (WebRTC, MSE, HLS, RTSP, MJPEG, ...).
  # It also receives the rendered dashboard page as the "dashboard" stream.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: go2rtc
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml
    ports:
      # Web UI + full HTTP API (can edit config and reveals camera URLs) -> localhost only by default.
      # Viewers use the dashboard container (port 8080, /go2rtc/...) instead.
      - "${GO2RTC_API_BIND:-127.0.0.1}:${GO2RTC_API_PORT:-1984}:1984/tcp"
      - "${GO2RTC_RTSP_PORT:-8554}:8554/tcp"   # RTSP output, e.g. rtsp://<host>:8554/camera1
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp" # WebRTC media
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp" # WebRTC media

  # Serves the custom web page (camera streams + Grafana panels).
  # go2rtc is reverse proxied under /go2rtc/ so the page works from any browser.
  dashboard:
    image: nginx:1.27-alpine
    container_name: dashboard
    restart: unless-stopped
    depends_on:
      - go2rtc
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

  # Renders the custom web page in a headless Chromium and pushes it to go2rtc
  # as the "dashboard" stream, so the page can be streamed forward like a camera.
  web-capture:
    build: ./web-capture
    container_name: web-capture
    restart: unless-stopped
    init: true
    shm_size: 1gb
    depends_on:
      - go2rtc
      - dashboard
    environment:
      CAPTURE_URL: ${CAPTURE_URL:-http://dashboard/?mode=mse}
      RTSP_TARGET: ${CAPTURE_RTSP_TARGET:-rtsp://go2rtc:8554/dashboard}
      SCREEN_WIDTH: ${CAPTURE_WIDTH:-1920}
      SCREEN_HEIGHT: ${CAPTURE_HEIGHT:-1080}
      FRAMERATE: ${CAPTURE_FRAMERATE:-15}
      STARTUP_DELAY: ${CAPTURE_STARTUP_DELAY:-5}
      VIDEO_BITRATE: ${CAPTURE_BITRATE:-4M}
